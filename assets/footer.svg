<svg width="100%" height="100%" viewBox="0 0 1000 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footer-wave-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="footer-wave-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <rect width="1000" height="120" fill="transparent" />

  <!-- Animated Wave 1 -->
  <path d="M 0,50 Q 250,90 500,45 T 1000,55 L 1000,120 L 0,120 Z" fill="url(#footer-wave-1)">
    <animate attributeName="d" dur="9s" repeatCount="indefinite"
      values="M 0,50 Q 250,90 500,45 T 1000,55 L 1000,120 L 0,120 Z;
              M 0,35 Q 250,15 500,55 T 1000,40 L 1000,120 L 0,120 Z;
              M 0,50 Q 250,90 500,45 T 1000,55 L 1000,120 L 0,120 Z" />
  </path>

  <!-- Animated Wave 2 -->
  <path d="M 0,65 Q 250,30 500,70 T 1000,50 L 1000,120 L 0,120 Z" fill="url(#footer-wave-2)">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="M 0,65 Q 250,30 500,70 T 1000,50 L 1000,120 L 0,120 Z;
              M 0,45 Q 250,80 500,35 T 1000,65 L 1000,120 L 0,120 Z;
              M 0,65 Q 250,30 500,70 T 1000,50 L 1000,120 L 0,120 Z" />
  </path>
</svg>
