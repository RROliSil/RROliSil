<svg width="100%" height="100%" viewBox="0 0 1000 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="wave-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .main-title {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 44px;
        fill: #ffffff;
        letter-spacing: 1px;
      }
      .subtitle {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 500;
        font-size: 19px;
        fill: #94A3B8;
        letter-spacing: 2px;
      }
      .badge-text {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 700;
        font-size: 13px;
        fill: #10B981;
      }
      .star {
        animation: pulse 3s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.8); }
        100% { opacity: 1; transform: scale(1.2); }
      }
    </style>
  </defs>

  <!-- Background Base Container -->
  <rect width="1000" height="240" rx="16" fill="#0B0F17" />
  
  <!-- Ambient Glow -->
  <circle cx="200" cy="40" r="130" fill="#10B981" opacity="0.12" filter="url(#glow)" />
  <circle cx="850" cy="180" r="140" fill="#8B5CF6" opacity="0.15" filter="url(#glow)" />

  <!-- Animated Wave Back -->
  <path d="M 0,160 Q 250,110 500,160 T 1000,150 L 1000,240 L 0,240 Z" fill="url(#wave-grad-1)">
    <animate attributeName="d" dur="10s" repeatCount="indefinite"
      values="M 0,160 Q 250,110 500,160 T 1000,150 L 1000,240 L 0,240 Z;
              M 0,140 Q 250,180 500,140 T 1000,165 L 1000,240 L 0,240 Z;
              M 0,160 Q 250,110 500,160 T 1000,150 L 1000,240 L 0,240 Z" />
  </path>

  <!-- Animated Wave Front -->
  <path d="M 0,175 Q 250,210 500,175 T 1000,180 L 1000,240 L 0,240 Z" fill="url(#wave-grad-2)">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="M 0,175 Q 250,210 500,175 T 1000,180 L 1000,240 L 0,240 Z;
              M 0,190 Q 250,150 500,195 T 1000,170 L 1000,240 L 0,240 Z;
              M 0,175 Q 250,210 500,175 T 1000,180 L 1000,240 L 0,240 Z" />
  </path>

  <!-- Bottom Accent Border -->
  <rect x="0" y="236" width="1000" height="4" fill="url(#header-grad)" />

  <!-- Stars / Tech Sparkles -->
  <g fill="#10B981" class="star" opacity="0.6">
    <circle cx="120" cy="65" r="2.5" />
    <circle cx="870" cy="50" r="2" />
    <circle cx="780" cy="95" r="3" fill="#38BDF8" />
    <circle cx="240" cy="110" r="1.5" fill="#A855F7" />
  </g>

  <!-- Status Pill Badge -->
  <g transform="translate(425, 24)">
    <rect width="150" height="26" rx="13" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="16" cy="13" r="4" fill="#10B981" />
    <text x="30" y="17" class="badge-text">PORTFOLIO &amp; LAB</text>
  </g>

  <!-- Main Title -->
  <text x="500" y="100" text-anchor="middle" class="main-title">
    Rafael <tspan fill="url(#header-grad)">|</tspan> RROliSil
  </text>

  <!-- Subtitle -->
  <text x="500" y="136" text-anchor="middle" class="subtitle">
    INDIE GAME DEVELOPER &amp; SOFTWARE ENGINEER
  </text>
</svg>
